<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cynergy Trade Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Design system: ui-ux-pro-max "Minimalism & Swiss / Trust" — navy + gold terminal.
     Layout: ui-ux-pro-max "Data-Dense Dashboard" — one 100dvh shell, no page scroll;
     every panel scrolls internally (tables keep sticky headers).
     Chart colors are the dataviz reference palette, re-validated against these
     surfaces (series-1 passes all checks on #222735 dark / #ffffff light;
     status hexes carry icon+label, never color alone). */
  :root { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body {
    --page:        #f6f7f9;  --surface:   #ffffff;
    --ink:         #0f172a;  --ink-2:     #475069;  --muted: #64748b;
    --grid:        #e2e8f0;  --baseline:  #cbd5e1;
    --series-1:    #2a78d6;
    --good:        #006300;  --warning:   #b45309;  --critical: #d03b3b;
    --accent:      #b45309;  --on-accent: #ffffff;
    --ring:        rgba(15,23,42,0.12);
    --wash:        rgba(15,23,42,0.04);
  }
  @media (prefers-color-scheme: dark) {
    body:not([data-theme="light"]) {
      --page:      #0f172a;  --surface:   #222735;
      --ink:       #f8fafc;  --ink-2:     #94a3b8;  --muted: #7c8aa5;
      --grid:      #2a3653;  --baseline:  #3d4c6e;
      --series-1:  #3987e5;
      --good:      #0ca30c;  --warning:   #fab219;  --critical: #e66767;
      --accent:    #f59e0b;  --on-accent: #0f172a;
      --ring:      rgba(248,250,252,0.12);
      --wash:      rgba(248,250,252,0.05);
    }
  }
  body[data-theme="dark"] {
    --page:      #0f172a;  --surface:   #222735;
    --ink:       #f8fafc;  --ink-2:     #94a3b8;  --muted: #7c8aa5;
    --grid:      #2a3653;  --baseline:  #3d4c6e;
    --series-1:  #3987e5;
    --good:      #0ca30c;  --warning:   #fab219;  --critical: #e66767;
    --accent:    #f59e0b;  --on-accent: #0f172a;
    --ring:      rgba(248,250,252,0.12);
    --wash:      rgba(248,250,252,0.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 13px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-feature-settings: "tnum" 0;
    /* terminal shell: appbar + KPI strip + grid share the viewport; nothing scrolls at page level */
    display: flex; flex-direction: column; gap: 8px;
    height: 100dvh; padding: 0 10px 10px; overflow: hidden;
  }
  /* ── app bar ─────────────────────────────────────────────────────────── */
  .appbar {
    flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 0 -10px; padding: 7px 10px;
    background: var(--page); border-bottom: 1px solid var(--ring);
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .brand .mark { width: 22px; height: 22px; flex: none; color: var(--accent); }
  .brand h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
  header .sub { color: var(--ink-2); font-size: 12px; }
  .appbar .spacer { flex: 1; }
  .chip { display: inline-flex; align-items: center; gap: 6px; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  #theme-toggle {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font: 12px/1 Inter, system-ui, sans-serif; font-weight: 500;
    padding: 5px 10px; border-radius: 8px;
    border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2);
    transition: border-color 0.15s, color 0.15s;
  }
  #theme-toggle:hover { border-color: var(--accent); color: var(--ink); }
  #theme-toggle svg { width: 14px; height: 14px; }
  #theme-toggle:focus-visible, .ph button:focus-visible, #detail-close:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }
  #banner {
    display: none; align-items: center; gap: 10px; padding: 8px 12px; flex: none;
    border: 1px solid var(--critical); border-radius: 10px;
    background: color-mix(in srgb, var(--critical) 10%, transparent);
    color: var(--critical); font-weight: 600;
  }
  #banner svg { width: 16px; height: 16px; flex: none; }
  /* ── KPI strip: portfolio tiles + scanner tiles in one row ────────────── */
  .kpis { flex: none; display: flex; gap: 8px; align-items: stretch; min-width: 0; }
  .tiles { display: grid; gap: 8px; min-width: 0; }
  #tiles { flex: 1.6; grid-template-columns: repeat(6, 1fr); }
  .scan-group {
    flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;
    padding: 6px 8px; border: 1px solid var(--ring); border-radius: 10px;
    background: var(--surface);
  }
  .scan-head {
    color: var(--ink-2); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em;
    display: flex; justify-content: space-between; gap: 8px; min-width: 0;
  }
  .scan-head #scan-foot {
    font-weight: 400; text-transform: none; letter-spacing: 0;
    color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .scan-group .tiles { grid-template-columns: repeat(4, 1fr); flex: 1; }
  .tile {
    background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
    padding: 7px 10px; min-width: 0; overflow: hidden;
    transition: border-color 0.15s;
  }
  .scan-group .tile { border: none; background: var(--wash); border-radius: 8px; padding: 4px 8px; }
  .tile .label { color: var(--ink-2); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .value { font-size: 19px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.hero .value { font-size: 26px; }
  .tile .delta { font-size: 11px; margin-top: 1px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .delta.up   { color: var(--good); }
  .delta.down { color: var(--critical); }
  /* ── main grid: equity | market (tall) | activity+console ─────────────── */
  main.grid {
    flex: 1; min-height: 0; display: grid; gap: 8px;
    grid-template-columns: minmax(300px, 1fr) minmax(420px, 1.4fr) minmax(270px, 0.85fr);
    grid-template-rows: minmax(0, 1.1fr) minmax(0, 1fr);
  }
  .panel {
    background: var(--surface); border: 1px solid var(--ring); border-radius: 10px;
    padding: 8px 10px; margin: 0; min-width: 0; min-height: 0;
    display: flex; flex-direction: column; gap: 6px;
  }
  .p-equity    { grid-column: 1; grid-row: 1; }
  .p-book      { grid-column: 1; grid-row: 2; }
  .p-market    { grid-column: 2; grid-row: 1 / span 2; }
  .p-activity  { grid-column: 3; grid-row: 1; }
  .p-console   { grid-column: 3; grid-row: 2; }
  .ph { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: none; }
  .ph h2 {
    font-size: 10px; color: var(--ink-2); margin: 0; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; margin-right: 2px;
  }
  .ph .count { color: var(--muted); font-size: 11px; }
  .ph button {
    font: 11px/1 Inter, system-ui, sans-serif; font-weight: 500; padding: 4px 12px;
    border-radius: 999px; cursor: pointer;
    border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2);
    transition: border-color 0.15s, color 0.15s, background 0.15s;
  }
  .ph button:hover { color: var(--ink); }
  .ph button.on {
    background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600;
  }
  .pbody { flex: 1; min-height: 0; overflow: auto; }
  /* ── equity chart ────────────────────────────────────────────────────── */
  #equity-wrap { position: relative; flex: 1; min-height: 120px; }
  #equity-svg { width: 100%; height: 100%; display: block; }
  #equity-svg text { font: 11px Inter, system-ui, sans-serif; fill: var(--muted); }
  #tooltip {
    position: absolute; display: none; pointer-events: none; background: var(--surface);
    border: 1px solid var(--ring); border-radius: 8px; padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    white-space: nowrap; z-index: 2;
  }
  #tooltip .v { font-weight: 600; }
  #tooltip .t { color: var(--ink-2); font-size: 11px; }
  details { margin-top: 4px; flex: none; }
  summary { color: var(--ink-2); font-size: 11px; cursor: pointer; }
  /* ── tables (sticky headers inside scrolling panels) ──────────────────── */
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th {
    text-align: left; color: var(--muted); font-weight: 500; font-size: 10px;
    padding: 4px 8px; border-bottom: 1px solid var(--baseline);
    text-transform: uppercase; letter-spacing: 0.05em;
    position: sticky; top: 0; background: var(--surface); z-index: 1;
  }
  td { padding: 4px 8px; border-bottom: 1px solid var(--grid); }
  tbody tr:last-child td, table > tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; white-space: nowrap; }
  .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  td a { color: var(--series-1); text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .chain-ic { display: inline-flex; align-items: center; margin-right: 5px; vertical-align: -2px; flex: none; }
  .chain-ic svg { width: 13px; height: 13px; display: block; }
  .refreshing { opacity: .55; transition: opacity .2s; }
  .empty { color: var(--muted); padding: 6px 8px; }
  .pill {
    display: inline-block; padding: 1px 9px; border-radius: 999px;
    font-size: 11px; font-weight: 500; line-height: 1.7;
    border: 1px solid var(--ring); color: var(--ink-2); background: var(--wash);
    white-space: nowrap;
  }
  .pill-good { color: var(--good); border-color: color-mix(in srgb, var(--good) 35%, transparent); }
  .pill-warn { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 35%, transparent); }
  .pill-bad  { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 35%, transparent); }
  .pill-info { color: var(--series-1); border-color: color-mix(in srgb, var(--series-1) 35%, transparent); }
  /* ── market table ────────────────────────────────────────────────────── */
  .p-market .pbody { overflow: auto; }
  #market table { min-width: 820px; }
  .p-market th, .p-market td { padding-left: 6px; padding-right: 6px; }
  .p-market td { white-space: nowrap; }
  #market tr[data-token] { cursor: pointer; }
  #market tr[data-token]:hover, #market tr[data-token]:focus { background: var(--wash); outline: none; }
  /* ── activity / console ──────────────────────────────────────────────── */
  #activity, #console {
    background: var(--page); border: 1px solid var(--ring); border-radius: 8px;
    font: 12px/1.6 ui-monospace, Consolas, monospace; padding: 6px 8px;
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  }
  /* grid (not flex): the message cell gets minmax(0,1fr) so a squeezed panel
     shrinks the message column instead of overflowing the token link onto it */
  #activity .row, #console .row { display: grid; grid-template-columns: auto 52px minmax(0, 1fr); gap: 8px; align-items: baseline; }
  #activity .row.dim, #console .row.dim { opacity: .65; }
  #activity .t, #console .t { color: var(--muted); }
  #activity .lv, #console .lv { font-weight: 700; }
  #activity .lv-signal, #console .lv-signal { color: var(--series-1); }
  #activity .lv-error, #console .lv-error, #activity .lv-fatal, #console .lv-fatal { color: var(--critical); }
  #activity .lv-warn, #console .lv-warn { color: var(--warning); }
  #activity .lv-skip, #console .lv-skip, #activity .lv-reject, #console .lv-reject { color: var(--muted); }
  #activity .m, #console .m { min-width: 0; overflow-wrap: anywhere; }
  /* ── token drill-down: modal overlay, not an inline space hog ─────────── */
  #token-detail {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center; padding: 24px;
    background: rgba(15,23,42,0.55);
  }
  #token-detail.open { display: flex; }
  #token-detail .sheet {
    background: var(--surface); border: 1px solid var(--ring); border-radius: 12px;
    width: min(960px, 100%); max-height: calc(100dvh - 48px);
    overflow: auto; padding: 14px 16px; box-shadow: 0 12px 40px rgba(0,0,0,.35);
  }
  #detail-close {
    font: 12px/1 Inter, system-ui, sans-serif; font-weight: 600; padding: 5px 12px;
    border-radius: 999px; cursor: pointer; margin-left: auto; flex: none;
    border: 1px solid var(--ring); background: var(--surface); color: var(--ink-2);
  }
  #detail-close:hover { border-color: var(--critical); color: var(--critical); }
  #token-detail .detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; margin-top: 8px; }
  #token-detail .detail-grid .grp { border: 1px solid var(--ring); border-radius: 8px; padding: 6px 10px; }
  #token-detail .grp h3 { font-size: 11px; color: var(--ink-2); margin: 0 0 4px; font-weight: 600; }
  #token-detail td { padding: 2px 6px; }
  /* ── narrow screens: back to a stacked, scrolling page ────────────────── */
  @media (max-width: 1023px) {
    body { display: block; height: auto; min-height: 100dvh; overflow: auto; padding: 0 12px 12px; }
    .appbar { margin: 0 -12px; padding: 8px 12px; }
    .kpis { flex-direction: column; margin-top: 10px; }
    #tiles { grid-template-columns: repeat(2, 1fr); }
    main.grid { display: flex; flex-direction: column; margin-top: 8px; }
    .panel { flex: none; }
    #equity-wrap { min-height: 200px; }
    #equity-svg { height: 200px; }
    #activity, #console { flex: none; height: 240px; }
    .pbody { overflow: visible; }
    .p-market .pbody { overflow-x: auto; }
    .tile.hero .value { font-size: 22px; }
    .tile .value { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<header class="appbar">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 17l4.5-5 3.5 3L21 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15 6h6v6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Cynergy Trade</h1>
  </div>
  <span class="sub" id="mode-chip"></span>
  <span class="sub" id="uptime"></span>
  <span class="chip sub" id="live-chip"><span class="dot" style="background: var(--good)"></span><span id="live-text">live</span></span>
  <span class="spacer"></span>
  <button id="theme-toggle" aria-label="Color theme">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/>
      <path id="theme-icon-rays" d="M12 2.5v2.8M12 18.7v2.8M2.5 12h2.8M18.7 12h2.8M5.3 5.3l2 2M16.7 16.7l2 2M18.7 5.3l-2 2M7.3 16.7l-2 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span id="theme-label">auto</span>
  </button>
</header>
<div id="banner">
  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M12 3L22 20H2L12 3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <path d="M12 10v4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="17.4" r="1.15" fill="currentColor"/>
  </svg>
  <span id="banner-text"></span>
</div>

<div class="kpis">
  <div class="tiles" id="tiles"></div>
  <div class="scan-group">
    <div class="scan-head"><span>Scanner</span><span id="scan-foot"></span></div>
    <div class="tiles" id="scan-tiles"></div>
  </div>
</div>

<main class="grid">
  <section class="panel p-equity">
    <div class="ph"><h2>Equity — total value (paper)</h2></div>
    <div id="equity-wrap">
      <svg id="equity-svg" role="img" aria-label="Equity curve"></svg>
      <div id="tooltip"></div>
    </div>
    <details><summary>Table view</summary><div id="equity-table"></div></details>
  </section>

  <section class="panel p-book">
    <div class="ph">
      <h2>Book</h2>
      <button id="tab-positions" class="on">Positions</button>
      <button id="tab-trades">Trades</button>
    </div>
    <div class="pbody">
      <div id="positions"></div>
      <div id="trades" hidden></div>
    </div>
  </section>

  <section class="panel p-market">
    <div class="ph"><h2>Market — every tracked token</h2><span class="count">click a row for detail</span></div>
    <div class="pbody" id="market"></div>
  </section>

  <section class="panel p-activity">
    <div class="ph">
      <h2>Activity</h2>
      <button id="actf-all" class="on" data-a="all">All</button>
      <button id="actf-actions" data-a="actions">Actions</button>
      <span class="count" id="act-count"></span>
    </div>
    <div id="activity"></div>
  </section>

  <section class="panel p-console">
    <div class="ph">
      <h2>Console</h2>
      <button id="logf-signals" class="on" data-f="signals">Signals</button>
      <button id="logf-all" data-f="all">All</button>
      <button id="logf-errors" data-f="errors">Errors</button>
      <span class="count" id="log-count"></span>
    </div>
    <div id="console"></div>
  </section>
</main>

<div id="token-detail" role="dialog" aria-modal="true" aria-label="Token detail">
  <div class="sheet" id="token-sheet"></div>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const fmtUsd = (n) => "$" + n.toLocaleString("en-US", { maximumFractionDigits: 2 });
const fmtUsdInt = (n) => (n < 0 ? "-$" : "$") + Math.round(Math.abs(n)).toLocaleString("en-US");
const fmtPct = (n) => (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
// never scientific notation: toPrecision() prints "1.23e-8" for memecoin prices
const fmtPrice = (n) => n == null ? "—"
  : n >= 1000 ? "$" + n.toLocaleString("en-US", { maximumFractionDigits: 2 })
  : n >= 1 ? "$" + n.toFixed(2)
  : n >= 0.01 ? "$" + n.toFixed(4)
  : "$" + n.toLocaleString("en-US", { maximumSignificantDigits: 4 });
const fmtTick = (v) => Math.abs(v) >= 1e6
  ? (v < 0 ? "-$" : "$") + Math.abs(v / 1e6).toFixed(2) + "M"
  : fmtUsdInt(v);
const fmtCompact = (n) => n == null ? "—" : n >= 1e9 ? "$" + (n / 1e9).toFixed(2) + "B" : n >= 1e6 ? "$" + (n / 1e6).toFixed(2) + "M" : n >= 1e3 ? "$" + (n / 1e3).toFixed(1) + "k" : "$" + n.toFixed(0);
const fmtAge = (iso) => {
  if (!iso) return "—";
  const s = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000));
  return s < 60 ? s + "s ago" : relTime(iso);
};
// TON addresses are 48-char base64url starting EQ/UQ; anything else is Solana base58
const isTonAddr = (addr) => /^(EQ|UQ)[A-Za-z0-9_-]{46}$/.test(addr);
const EXPLORER = {
  solana: (a) => "https://solscan.io/token/" + a,
  ton: (a) => "https://tonviewer.com/" + a,
  bsc: (a) => "https://bscscan.com/token/" + a,
  base: (a) => "https://basescan.org/token/" + a,
  polygon: (a) => "https://polygonscan.com/token/" + a,
  arbitrum: (a) => "https://arbiscan.io/token/" + a,
};
// no chain on the payload (activity rows) → address-shape heuristic
const explorerUrl = (addr, chain) =>
  (EXPLORER[chain] ?? (isTonAddr(addr) ? EXPLORER.ton : EXPLORER.solana))(addr);
// Chain badge glyphs (simplified brand marks, colored per chain; tooltip carries the name)
const CHAINS = {
  solana: { color: "#9945FF", label: "Solana",
    svg: '<path d="M5.2 7.1l2-2h11.6l-2 2zM7.2 13.1h11.6l-2 2H5.2zM5.2 19.1l2-2h11.6l-2 2z" fill="currentColor"/>' },
  ton: { color: "#0098EA", label: "TON",
    svg: '<path d="M8.7 3h6.6l5.1 5.4L12 21.5 3.6 8.4z" fill="currentColor"/>' },
  bsc: { color: "#F0B90B", label: "BNB Chain",
    svg: '<path d="M12 8.1l3.4 3.4L12 14.9l-3.4-3.4zM12 2.8l1.9 1.9L12 6.6l-1.9-1.9zM12 17.4l1.9 1.9L12 21.2l-1.9-1.9zM6.1 10.8L8 12.7l-1.9 1.9-1.9-1.9zM17.9 10.8l1.9 1.9-1.9 1.9-1.9-1.9z" fill="currentColor"/>' },
  base: { color: "#0052FF", label: "Base",
    svg: '<circle cx="12" cy="12" r="9.2" fill="currentColor"/><path d="M2.8 10.9h8.8v2.2H2.8z" fill="var(--surface)"/>' },

    spark.append(cross);
    sparkCap = h("div", { style: "color: var(--ink-2); font-size: 11px" });
    const summary = `${fmtPrice(hist[0].priceUsd)} → ${fmtPrice(hist[hist.length - 1].priceUsd)} · ${new Date(hist[0].at).toLocaleTimeString()} → ${new Date(hist[hist.length - 1].at).toLocaleTimeString()} · bars = $vol 1h`;
    sparkCap.textContent = summary;
    // hover: the whole svg is the hit target; the readout swaps the caption line
    spark.addEventListener("mousemove", (e) => {
      const r = spark.getBoundingClientRect();
      const i = Math.max(0, Math.min(hist.length - 1, Math.round(((e.clientX - r.left) / r.width) * (hist.length - 1))));
      cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
      const p = hist[i];
      sparkCap.textContent = `${fmtPrice(p.priceUsd)} · ${fmtCompact(p.volumeUsd1h || 0)} vol 1h · ${new Date(p.at).toLocaleTimeString()}`;
    });
    spark.addEventListener("mouseleave", () => {
      cross.setAttribute("visibility", "hidden");
      sparkCap.textContent = summary;
    });
  }
  el.replaceChildren(
    close,
    h("div", { style: "display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap" },
      h("a", { class: "mono", href: explorerUrl(d.token), target: "_blank", rel: "noopener", text: d.token }),
      h("span", { text: d.status, style: "font-weight: 600" }),
      h("span", { text: `score ${d.score} · tracked ${relTime(d.firstSeenAt)} · ${hist.length} price points`, style: "color: var(--ink-2)" })),
    hist.length >= 2
      ? h("div", { style: "margin-top: 6px" }, spark, sparkCap)
      : h("div", { class: "empty", text: "no persisted price history yet — the sparkline starts after the first snapshot minute" }),
    h("div", { class: "detail-grid" },
      sec ? grp("Security", [
        ["Verdict", sec.status], ["Score", String(sec.score)], ["Checked", fmtAge(sec.checkedAt)],
        ...(sec.reasons.length ? [["Flags", sec.reasons.map((r) => `${r.severity}:${r.code}`).join(" · ")]] : []),
      ]) : null,
      d.holderDist ? grp("Holders", [
        ["Top 1 / 10 / 20 %", `${d.holderDist.top1Pct.toFixed(1)} / ${d.holderDist.top10Pct.toFixed(1)} / ${d.holderDist.top20Pct.toFixed(1)}`],
        ["Insider / sniper", `${d.holderDist.insiderPct.toFixed(1)}% / ${d.holderDist.sniperPct.toFixed(1)}%`],
        ["Bundler / whale", `${d.holderDist.bundlerPct.toFixed(1)}% / ${d.holderDist.whalePct.toFixed(1)}%`],
        ["Growth 15m / 1h", `${fmtPct(d.holderDist.holderGrowth15m)} / ${fmtPct(d.holderDist.holderGrowth1h)}`],
      ]) : null,
      d.liquidity ? grp("Pool & execution", [
        ["DEX", d.dex ?? "—"],
        ["Pool age", fmtDur(d.liquidity.poolAgeMs)],
        ["Slippage $50 / $500", `${d.liquidity.slippageBps50} / ${d.liquidity.slippageBps500} bps`],
        ["Liq Δ 5m / 15m", `${fmtPct(d.liquidity.liquidityChange5m)} / ${fmtPct(d.liquidity.liquidityChange15m)}`],
      ]) : null,
      d.market ? grp("Micro-flow (1m)", [
        ["Buys / sells", `${d.market.buyCount1m} / ${d.market.sellCount1m}`],
        ["Buy / sell vol", `${fmtCompact(d.market.buyVolumeUsd1m)} / ${fmtCompact(d.market.sellVolumeUsd1m)}`],
        ["Traders 24h", (d.market.uniqueTraders24h || 0).toLocaleString("en-US")],
        ["Δ 1m / 15m", `${fmtPct(d.market.priceChange1m)} / ${fmtPct(d.market.priceChange15m)}`],
      ]) : null,
      grp("Scores", [
        ["Opportunity", d.scores.opportunity.toFixed(1)],
        ["Momentum / security", `${d.scores.momentum.toFixed(0)} / ${d.scores.security.toFixed(0)}`],
        ["Liquidity / holder", `${d.scores.liquidity.toFixed(0)} / ${d.scores.holder.toFixed(0)}`],
        ["Market / exec / risk", `${d.scores.marketQuality.toFixed(0)} / ${d.scores.execution.toFixed(0)} / ${d.scores.risk.toFixed(0)}`],
      ]),
    ),
  );
  if (focus) close.focus(); // modal open → focus lands on its dismiss control
}
function niceTicks(min, max, count) {
  const span = max - min || 1;
  const step = Math.pow(10, Math.floor(Math.log10(span / count)));
  for (const m of [1, 2, 5, 10]) if (span / (step * m) <= count) { return { step: step * m }; }
  return { step };
}
function drawEquity() {
  const svg = $("equity-svg");
  // 1 SVG unit = 1 CSS px in both axes: the chart fills its flexible panel, so
  // measure the wrap — a fixed viewBox stretched to the container distorted
  // text, dots and stroke widths
  const rect = $("equity-wrap").getBoundingClientRect();
  const W = Math.max(320, Math.round(rect.width) || 800);
  const H = Math.max(150, Math.round(rect.height) || 240);
  const L = 64, R = 14, T = 14, B = 26;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.replaceChildren();
  if (history.length < 2) {
    const t = h("text", { x: W / 2, y: H / 2, "text-anchor": "middle" });
    t.textContent = "collecting data…";
    svg.append(t);
    return;
  }
  const vals = history.map((d) => d.totalValueUsd);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo || hi * 0.01) * 0.08;
  lo -= pad; hi += pad;
  const x = (i) => L + (i / (history.length - 1)) * (W - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);

  // gridlines + y ticks
  const { step } = niceTicks(lo, hi, 4);
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) {
    svg.append(h("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: cssVar("--grid"), "stroke-width": 1 }));
    const t = h("text", { x: L - 8, y: y(v) + 4, "text-anchor": "end" });
    t.textContent = fmtTick(v);
    svg.append(t);
  }
  // x ticks (time)
  for (let k = 0; k <= 4; k++) {
    const i = Math.round((k / 4) * (history.length - 1));
    const t = h("text", { x: x(i), y: H - 8, "text-anchor": k === 0 ? "start" : k === 4 ? "end" : "middle" });
    t.textContent = new Date(history[i].at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    svg.append(t);
  }
  // area wash (10%) + 2px line
  const line = history.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(d.totalValueUsd).toFixed(1)}`).join("");
  svg.append(h("path", { d: `${line}L${x(history.length - 1)},${y(lo)}L${x(0)},${y(lo)}Z`, fill: cssVar("--series-1"), opacity: 0.1 }));
  svg.append(h("path", { d: line, fill: "none", stroke: cssVar("--series-1"), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
  // end dot (r4 + 2px surface ring) + end label
  const last = history[history.length - 1];
  svg.append(h("circle", { cx: x(history.length - 1), cy: y(last.totalValueUsd), r: 6, fill: cssVar("--surface") }));
  svg.append(h("circle", { cx: x(history.length - 1), cy: y(last.totalValueUsd), r: 4, fill: cssVar("--series-1") }));
  // surface-stroke halo keeps the label readable where it crosses the line;
  // flip to the right of the dot when there is no room on the left
  const lastX = x(history.length - 1);
  const el = h("text", {
    x: lastX - W * 0.16 < L + 4 ? lastX + 10 : lastX - 8,
    y: Math.max(T + 8, y(last.totalValueUsd) - 10),
    "text-anchor": lastX - W * 0.16 < L + 4 ? "start" : "end",
    fill: cssVar("--ink"),
    style: `paint-order: stroke; stroke: ${cssVar("--surface")}; stroke-width: 3px; font-weight: 600`,
  });
  el.textContent = fmtUsd(last.totalValueUsd);
  svg.append(el);

  // crosshair + tooltip
  const cross = h("line", { y1: T, y2: H - B, stroke: cssVar("--baseline"), "stroke-width": 1, visibility: "hidden" });
  const dot = h("circle", { r: 4, fill: cssVar("--series-1"), stroke: cssVar("--surface"), "stroke-width": 2, visibility: "hidden" });
  svg.append(cross, dot);
  const overlay = h("rect", { x: L, y: T, width: W - L - R, height: H - T - B, fill: "transparent" });
  overlay.style.cursor = "crosshair";
  overlay.addEventListener("pointermove", (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = ((ev.clientX - rect.left) / rect.width) * W;
    const i = Math.max(0, Math.min(history.length - 1, Math.round(((px - L) / (W - L - R)) * (history.length - 1))));
    const d = history[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible");
    dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(d.totalValueUsd)); dot.setAttribute("visibility", "visible");
    const tip = $("tooltip");
    tip.replaceChildren(h("div", { class: "v", text: fmtUsd(d.totalValueUsd) }),
      h("div", { class: "t", text: new Date(d.at).toLocaleString() + ` · dd ${(d.drawdownPct ?? 0).toFixed(3)}%` }));
    tip.style.display = "block";
    const wrap = $("equity-wrap").getBoundingClientRect();
    let tx = ev.clientX - wrap.left + 14, ty = ev.clientY - wrap.top - 10;
    if (tx + 170 > wrap.width) tx -= 190;
    tip.style.left = tx + "px"; tip.style.top = ty + "px";
  });
  overlay.addEventListener("pointerleave", () => {
    cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden");
    $("tooltip").style.display = "none";
  });
  svg.append(overlay);

  // table view
  const tbl = h("table");
  tbl.append(h("tr", {}, h("th", { text: "Time" }), h("th", { class: "num", text: "Total value" }), h("th", { class: "num", text: "Drawdown" })));
  const stride = Math.max(1, Math.floor(history.length / 24));
  // newest first — latest snapshot is the top row
  for (let i = history.length - 1; i >= 0; i -= stride) {
    const d = history[i];
    tbl.append(h("tr", {},
      h("td", { text: new Date(d.at).toLocaleTimeString() }),
      h("td", { class: "num", text: fmtUsd(d.totalValueUsd) }),
      h("td", { class: "num", text: (d.drawdownPct ?? 0).toFixed(3) + "%" })));
  }
  $("equity-table").replaceChildren(tbl);
}

// Live status stream — every push renders immediately (decision cycle = 10s ticks)
const es = new EventSource("/events");
es.onmessage = (e) => {
  try { renderStatus(JSON.parse(e.data)); } catch { /* skip malformed frame */ }
};
es.onerror = () => { $("mode-chip").textContent = "monitor unreachable"; };

if (location.protocol === "file:") {
  const d = document.createElement("div");
  d.textContent = "You opened this file from disk — endpoints unreachable. Open http://localhost:3000 instead.";
  d.style.cssText = "border:1px solid var(--critical);color:var(--critical);padding:8px 12px;border-radius:8px;margin:14px 0";
  document.body.prepend(d);
}

applyTheme();
refreshStatus(); refreshHistory();
setInterval(refreshStatus, 10_000);
setInterval(refreshHistory, 15_000);
addEventListener("resize", () => drawEquity()); // re-fit viewBox 1:1 to the new panel size

// 1s local ticker — keeps "last scan" visibly alive between polls
function tick() {
  const st = window.__lastStatus;
  if (!st) return;
  const up = Math.floor(st.uptimeMs / 60000 + (Date.now() - window.__statusAt) / 60000);
  $("uptime").textContent = up < 60 ? `up ${up}m` : `up ${Math.floor(up / 60)}h ${up % 60}m`;
  const sc = st.scanner;
  if (sc) {
    const ago = sc.lastScreenAt ? Math.max(0, Math.round((Date.now() - new Date(sc.lastScreenAt).getTime()) / 1000)) : null;
    $("scan-foot").textContent = ago == null
      ? "no market scan yet"
      : `last scan ${ago}s ago · rejected re-screen every 5 min`;
    $("live-text").textContent = `live · ${ago == null ? "—" : ago + "s since scan"}`;
  }
}
setInterval(tick, 1_000);
</script>
